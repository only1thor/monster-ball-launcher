<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1119">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Monster Ball Launcher</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="game-area">
      <canvas id="game"></canvas>
    </div>
    <div id="controls">
      <div id="joystick-zone" aria-label="Movement joystick">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="button-col">
        <button id="btn-a" class="atk-btn atk-a" type="button" aria-label="Attack"></button>
        <button id="btn-b" class="atk-btn atk-b" type="button" aria-label="Attack"></button>
      </div>
    </div>
  </div>
  <script src="js/core.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
